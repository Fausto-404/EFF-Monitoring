services:
  eff-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eff_password}
      POSTGRES_DB: eff_monitoring
    volumes:
      - eff-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eff -d eff_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  eff-redis:
    image: redis:7-alpine
    volumes:
      - eff-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  eff-api:
    image: ${EFF_API_IMAGE:-eff-monitoring-api:v2.2.2}
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - eff-backup-data:/app/backup_files
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://eff:${POSTGRES_PASSWORD:-eff_password}@eff-postgres:5432/eff_monitoring}
      REDIS_URL: ${REDIS_URL:-redis://eff-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BLOCK_RUNNER_TOKEN: ${BLOCK_RUNNER_TOKEN:-}
    ports:
      - "${EFF_API_PORT:-8000}:8000"
    depends_on:
      - eff-postgres
      - eff-redis
    restart: unless-stopped

  eff-worker:
    image: ${EFF_WORKER_IMAGE:-eff-monitoring-worker:v2.2.2}
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      - eff-backup-data:/app/backup_files
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://eff:${POSTGRES_PASSWORD:-eff_password}@eff-postgres:5432/eff_monitoring}
      REDIS_URL: ${REDIS_URL:-redis://eff-redis:6379/0}
      BLOCK_RUNNER_TOKEN: ${BLOCK_RUNNER_TOKEN:-}
    command: ["python", "-m", "app.workers.worker"]
    networks: [default, block-egress]
    depends_on:
      - eff-api
    restart: unless-stopped

  eff-block-runner:
    profiles: ["auto-block"]
    image: ${EFF_API_IMAGE:-eff-monitoring-api:v2.2.2}
    environment:
      BLOCK_RUNNER_TOKEN: ${BLOCK_RUNNER_TOKEN:-}
      BLOCK_DEVICE_TOKEN: ${BLOCK_DEVICE_TOKEN:-}
      BLOCK_DEVICE_TOKENS_JSON: ${BLOCK_DEVICE_TOKENS_JSON:-}
    command: ["uvicorn", "app.block_runner:app", "--host", "0.0.0.0", "--port", "8090"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks: [block-egress]
    restart: unless-stopped

  eff-web:
    image: ${EFF_WEB_IMAGE:-eff-monitoring-web:v2.2.2}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${EFF_WEB_PORT:-8080}:80"
    depends_on:
      - eff-api
    restart: unless-stopped

volumes:
  eff-postgres-data:
  eff-redis-data:
  eff-backup-data:

networks:
  block-egress:
    driver: bridge
